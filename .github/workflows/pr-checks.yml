name: 代码审查助手

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: PR 检查
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史以便比较
        
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8 black
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: 运行测试
      run: |
        pytest tests/ -v --cov=src --cov-report=term --cov-report=xml
        
    - name: 代码覆盖率评论
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 60
      continue-on-error: true
        
    - name: 检查代码格式
      run: |
        black --check src/ tests/ || echo "::warning::代码格式需要调整，请运行 'black src/ tests/'"
        
    - name: Lint 检查
      run: |
        flake8 src/ tests/ --max-line-length=127 || echo "::warning::发现代码风格问题"
        
    - name: 添加 PR 标签
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['automated-check']
          })
